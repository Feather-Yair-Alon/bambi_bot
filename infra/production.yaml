AWSTemplateFormatVersion: "2010-09-09"
Description: Production serverless infrastructure for the Bambi WhatsApp knowledge agent

Parameters:
  ImageUri:
    Type: String
  AnthropicModel:
    Type: String
    Default: claude-sonnet-5
  MetaGraphApiVersion:
    Type: String
    Default: v23.0
  LogRetentionDays:
    Type: Number
    Default: 30

Resources:
  RuntimeSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: bambi-bot/production/runtime
      Description: Anthropic, Meta WhatsApp and MyBusiness production credentials
      GenerateSecretString:
        SecretStringTemplate: '{"anthropic_api_key":"","mybusiness_app_id":"","mybusiness_master_key":"","mybusiness_base_url":"","meta_verify_token":"","meta_app_secret":"","meta_access_token":"","meta_phone_number_id":""}'
        GenerateStringKey: bootstrap_nonce
        PasswordLength: 32

  RuntimeTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: bambi-bot-production
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bambi-bot-production-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  InboundQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bambi-bot-production-inbound
      VisibilityTimeout: 920
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 5

  WebhookRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: WebhookRuntimeAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt InboundQueue.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref RuntimeSecret

  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: WorkerRuntimeAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref RuntimeSecret
              - Effect: Allow
                Action:
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource: !GetAtt RuntimeTable.Arn
              - Effect: Allow
                Action:
                  - sqs:ChangeMessageVisibility
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ReceiveMessage
                Resource: !GetAtt InboundQueue.Arn

  WebhookFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: bambi-bot-production-webhook
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - app.aws.webhook.handler
      Architectures:
        - x86_64
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt WebhookRole.Arn
      Environment:
        Variables:
          RUNTIME_SECRET_ARN: !Ref RuntimeSecret
          INBOUND_QUEUE_URL: !Ref InboundQueue

  WorkerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: bambi-bot-production-worker
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - app.aws.worker.handler
      Architectures:
        - x86_64
      MemorySize: 1024
      Timeout: 900
      Role: !GetAtt WorkerRole.Arn
      Environment:
        Variables:
          APP_ENV: production
          ADMIN_API_TOKEN: whatsapp-runtime-no-admin-api
          STORAGE_BACKEND: dynamodb
          DYNAMODB_TABLE_NAME: !Ref RuntimeTable
          LLM_PROVIDER: anthropic
          ANTHROPIC_MODEL: !Ref AnthropicModel
          ANTHROPIC_TIMEOUT_SECONDS: "90"
          META_GRAPH_API_VERSION: !Ref MetaGraphApiVersion
          RUNTIME_SECRET_ARN: !Ref RuntimeSecret

  WorkerEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 5
      Enabled: true
      EventSourceArn: !GetAtt InboundQueue.Arn
      FunctionName: !Ref WorkerFunction
      FunctionResponseTypes:
        - ReportBatchItemFailures
      MaximumBatchingWindowInSeconds: 1

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: bambi-bot-production
      ProtocolType: HTTP

  WebhookIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt WebhookFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 10000

  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /health
      Target: !Sub integrations/${WebhookIntegration}

  WebhookGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /webhook
      Target: !Sub integrations/${WebhookIntegration}

  WebhookPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /webhook
      Target: !Sub integrations/${WebhookIntegration}

  HttpStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25

  WebhookInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebhookFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

  WebhookLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${WebhookFunction}
      RetentionInDays: !Ref LogRetentionDays

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${WorkerFunction}
      RetentionInDays: !Ref LogRetentionDays

  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: bambi-bot-production-dead-letter-messages
      AlarmDescription: WhatsApp messages exhausted all automatic retries
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiBaseUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  WebhookUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/webhook
  RuntimeSecretArn:
    Value: !Ref RuntimeSecret
  RuntimeTableName:
    Value: !Ref RuntimeTable
  InboundQueueUrl:
    Value: !Ref InboundQueue
