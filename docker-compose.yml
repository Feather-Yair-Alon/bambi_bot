services:
  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
    ports:
      - "8000:8000"
    volumes:
      - bambi_data:/app/data

volumes:
  bambi_data:
